{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yogesh Gaikwad | Software Engineer · Distributed Systems</title>
    <meta name="description"
        content="Interactive AI-powered portfolio of Yogesh Gaikwad - Software Engineer specializing in Distributed Systems, Backend Infrastructure, Node.js, TypeScript, and AWS. Based in Dublin, Ireland.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;500;600;700;800&family=Fira+Code:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-void: #020408;
            --bg-primary: #060d12;
            --bg-secondary: #0a1520;
            --bg-tertiary: #0e1f2e;
            --bg-card: #091520;
            --neon-cyan: #00ffe1;
            --neon-blue: #0088ff;
            --neon-violet: #7b2fff;
            --neon-pink: #ff2d9b;
            --neon-green: #00ff88;
            --accent-primary: #00ffe1;
            --accent-secondary: #7b2fff;
            --accent-gradient: linear-gradient(135deg, #00ffe1 0%, #0088ff 50%, #7b2fff 100%);
            --accent-glow-cyan: rgba(0, 255, 225, 0.25);
            --accent-glow-violet: rgba(123, 47, 255, 0.25);
            --text-primary: #e8f4f8;
            --text-secondary: #7fa8b8;
            --text-muted: #3d6070;
            --text-code: #00ffe1;
            --border-color: #0f2535;
            --border-bright: #00ffe133;
            --border-violet: #7b2fff33;
            --scan-line: rgba(0, 255, 225, 0.03);
        }

        [data-theme="light"] {
            --bg-void: #dde4ec;
            --bg-primary: #e8eef5;
            --bg-secondary: #d4dce8;
            --bg-tertiary: #c8d3e2;
            --bg-card: #f0f4f9;
            --neon-cyan: #005fa3;
            --neon-blue: #003d82;
            --neon-violet: #3d0fa8;
            --neon-pink: #96103d;
            --neon-green: #005535;
            --accent-primary: #005fa3;
            --accent-secondary: #3d0fa8;
            --accent-gradient: linear-gradient(135deg, #005fa3 0%, #003d82 50%, #3d0fa8 100%);
            --accent-glow-cyan: rgba(0, 95, 163, 0.18);
            --accent-glow-violet: rgba(61, 15, 168, 0.18);
            --text-primary: #06111a;
            --text-secondary: #1a3a52;
            --text-muted: #3a5268;
            --text-code: #004a8f;
            --border-color: #98b0c8;
            --border-bright: #005fa355;
            --border-violet: #3d0fa855;
            --scan-line: rgba(0, 63, 130, 0.04);
        }

        *, *::before, *::after { box-sizing: border-box; transition: background-color 0.35s, border-color 0.35s, color 0.2s, box-shadow 0.3s; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Syne', sans-serif; background: var(--bg-void); color: var(--text-primary); min-height: 100vh; overflow-x: hidden; }
        .font-mono { font-family: 'Space Mono', monospace; }
        .font-code { font-family: 'Fira Code', monospace; }

        .gradient-bg { background: var(--bg-void); position: fixed; inset: 0; z-index: -2; overflow: hidden; }
        .gradient-bg::before {
            content: '';
            position: absolute; inset: 0;
            background: radial-gradient(ellipse 60% 50% at 15% 10%, rgba(0,255,225,0.07) 0%, transparent 60%),
                        radial-gradient(ellipse 50% 60% at 85% 90%, rgba(123,47,255,0.09) 0%, transparent 60%),
                        radial-gradient(ellipse 40% 40% at 50% 50%, rgba(0,136,255,0.04) 0%, transparent 60%);
            animation: atmospherePulse 12s ease-in-out infinite;
        }
        [data-theme="light"] .gradient-bg::before {
            background: radial-gradient(ellipse 60% 50% at 15% 10%, rgba(0,63,130,0.09) 0%, transparent 60%),
                        radial-gradient(ellipse 50% 60% at 85% 90%, rgba(61,15,168,0.09) 0%, transparent 60%);
        }
        .gradient-bg::after {
            content: '';
            position: absolute; inset: 0;
            background-image: linear-gradient(var(--scan-line) 1px, transparent 1px), linear-gradient(90deg, var(--scan-line) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
        }

        .particle-layer { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
        .particle { position: absolute; width: 1px; background: linear-gradient(to bottom, transparent, var(--neon-cyan), transparent); opacity: 0; animation: dataStream linear infinite; }

        @keyframes dataStream { 0% { opacity: 0; transform: translateY(-100%); } 10% { opacity: 0.6; } 90% { opacity: 0.4; } 100% { opacity: 0; transform: translateY(100vh); } }

        .scan-sweep { position: fixed; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent); opacity: 0.15; animation: scanSweep 8s linear infinite; z-index: -1; pointer-events: none; }
        [data-theme="light"] .scan-sweep { opacity: 0.1; }
        @keyframes scanSweep { 0% { top: 0%; opacity: 0; } 5% { opacity: 0.15; } 95% { opacity: 0.15; } 100% { top: 100%; opacity: 0; } }
        @keyframes atmospherePulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

        .chat-container { max-width: 920px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }

        /* ── HEADER ── */
        .header {
            padding: 0.875rem 1.25rem;
            border-bottom: 1px solid var(--border-bright);
            backdrop-filter: blur(20px) saturate(180%);
            background: rgba(6,13,18,0.92);
            display: flex; justify-content: space-between; align-items: center;
            position: relative; overflow: hidden;
        }
        [data-theme="light"] .header { background: rgba(220,230,240,0.94); }
        .header::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--accent-gradient); opacity: 0.8; }
        .header::after  { content: ''; position: absolute; bottom: -1px; left: 0; width: 120px; height: 1px; background: var(--accent-gradient); opacity: 0.6; }

        .terminal-dots { display: flex; gap: 6px; margin-right: 0.75rem; }
        .terminal-dots span { width: 10px; height: 10px; border-radius: 50%; }
        .terminal-dots span:nth-child(1) { background: #ff5f56; box-shadow: 0 0 6px #ff5f5688; }
        .terminal-dots span:nth-child(2) { background: #ffbd2e; box-shadow: 0 0 6px #ffbd2e88; }
        .terminal-dots span:nth-child(3) { background: #27c93f; box-shadow: 0 0 6px #27c93f88; }

        .header-content { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .header-left    { display: flex; align-items: center; gap: 0.75rem; }
        .header-right   { display: flex; align-items: center; gap: 0.75rem; }

        .profile-photo {
            width: 48px; height: 48px;
            border-radius: 10px;
            background: var(--accent-gradient);
            border: 1px solid var(--border-bright);
            overflow: hidden; position: relative; cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .profile-photo:hover { transform: scale(1.08); box-shadow: 0 0 20px var(--accent-glow-cyan), 0 0 40px var(--accent-glow-violet); }
        .profile-photo img { width: 100%; height: 100%; object-fit: cover; }

        .header-title { font-family: 'Space Mono', monospace; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -0.5px; }
        .header-subtitle { font-family: 'Fira Code', monospace; font-size: 0.7rem; color: var(--text-muted); letter-spacing: 0.5px; }
        .header-subtitle::before { content: '// '; color: var(--neon-cyan); opacity: 0.85; }

        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--neon-green); box-shadow: 0 0 8px var(--neon-green); display: inline-block; margin-right: 5px; animation: statusPulse 2s ease-in-out infinite; }
        @keyframes statusPulse { 0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--neon-green); } 50% { opacity: 0.5; box-shadow: 0 0 3px var(--neon-green); } }

        /* ── CV DOWNLOAD BUTTON ── */
        .cv-btn {
            display: flex; align-items: center; gap: 0.4rem;
            padding: 0.4rem 0.85rem;
            background: transparent;
            border: 1px solid var(--border-bright);
            border-radius: 8px;
            color: var(--neon-cyan);
            font-family: 'Fira Code', monospace;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-decoration: none;
            cursor: pointer;
            position: relative; overflow: hidden;
            transition: all 0.25s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .cv-btn::before { content: ''; position: absolute; inset: 0; background: var(--accent-gradient); opacity: 0; transition: opacity 0.25s; }
        .cv-btn:hover { border-color: var(--neon-cyan); color: var(--bg-void); transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow-cyan); }
        .cv-btn:hover::before { opacity: 1; }
        .cv-btn:active { transform: translateY(0) scale(0.97); }
        .cv-btn svg, .cv-btn span { position: relative; z-index: 1; }

        /* ── SOCIAL LINKS ── */
        .social-links { display: flex; gap: 0.4rem; align-items: center; }
        .social-link { width: 32px; height: 32px; border-radius: 8px; background: var(--bg-tertiary); border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; color: var(--text-secondary); text-decoration: none; transition: all 0.25s; position: relative; overflow: hidden; }
        .social-link::before { content: ''; position: absolute; inset: 0; background: var(--accent-gradient); opacity: 0; transition: opacity 0.25s; }
        .social-link:hover { border-color: var(--neon-cyan); color: var(--bg-void); transform: translateY(-3px); box-shadow: 0 6px 20px var(--accent-glow-cyan); }
        .social-link:hover::before { opacity: 1; }
        .social-link svg { position: relative; z-index: 1; }

        /* ── THEME TOGGLE ── */
        .theme-toggle { width: 48px; height: 26px; background: var(--bg-tertiary); border: 1px solid var(--border-bright); border-radius: 13px; cursor: pointer; position: relative; transition: all 0.3s; }
        .theme-toggle:hover { border-color: var(--neon-cyan); box-shadow: 0 0 12px var(--accent-glow-cyan); }
        .theme-toggle::after { content: '◐'; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background: var(--accent-gradient); border-radius: 50%; font-size: 9px; color: #0d1117; line-height: 18px; text-align: center; transition: left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        [data-theme="light"] .theme-toggle::after { content: '◑'; left: calc(100% - 21px); }

        /* ── MESSAGES ── */
        .messages-area { flex: 1; overflow-y: auto; padding: 1.5rem 1.25rem; scroll-behavior: smooth; }
        .messages-area::-webkit-scrollbar { width: 4px; }
        .messages-area::-webkit-scrollbar-track { background: transparent; }
        .messages-area::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }
        .messages-area::-webkit-scrollbar-thumb:hover { background: var(--neon-cyan); }

        .message { margin-bottom: 1.25rem; animation: msgReveal 0.5s cubic-bezier(0.16,1,0.3,1) both; }
        @keyframes msgReveal { from { opacity: 0; transform: translateY(16px); filter: blur(4px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }

        .message-agent { display: flex; gap: 0.75rem; align-items: flex-start; }
        .message-user  { display: flex; justify-content: flex-end; }

        .avatar { width: 36px; height: 36px; border-radius: 10px; background: var(--bg-secondary); border: 1px solid var(--border-bright); display: flex; align-items: center; justify-content: center; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 11px; flex-shrink: 0; color: var(--neon-cyan); position: relative; overflow: hidden; }
        .avatar::before { content: ''; position: absolute; inset: 0; background: var(--accent-gradient); opacity: 0.1; }
        .avatar::after  { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: var(--accent-gradient); }

        .bubble { padding: 1rem 1.25rem; max-width: 82%; position: relative; }
        .bubble-agent { background: var(--bg-card); border: 1px solid var(--border-bright); border-radius: 4px 16px 16px 16px; position: relative; overflow: hidden; }
        .bubble-agent::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--accent-gradient); opacity: 0.7; }
        .bubble-agent::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(0,255,225,0.02) 0%, transparent 50%), linear-gradient(var(--scan-line) 1px, transparent 1px); background-size: 100% 100%, 100% 24px; pointer-events: none; }
        .bubble-user { background: linear-gradient(135deg, rgba(0,255,225,0.15) 0%, rgba(123,47,255,0.2) 100%); border: 1px solid var(--border-bright); border-radius: 16px 4px 16px 16px; box-shadow: 0 0 20px rgba(0,255,225,0.08); }
        [data-theme="light"] .bubble-user { background: linear-gradient(135deg, rgba(0,63,130,0.15) 0%, rgba(61,15,168,0.18) 100%); border-color: rgba(0,63,130,0.4); }

        [data-theme="light"] .bubble-agent p,
        [data-theme="light"] .bubble-agent span,
        [data-theme="light"] .bubble-agent li,
        [data-theme="light"] .bubble-agent div { color: var(--text-primary); }
        [data-theme="light"] .bubble-user p { color: #04111f; font-weight: 500; }

        .typing-indicator { display: flex; gap: 5px; padding: 0.5rem 0.25rem; align-items: center; }
        .typing-dot { width: 7px; height: 7px; background: var(--neon-cyan); border-radius: 50%; animation: typingBounce 1.2s infinite ease-in-out both; box-shadow: 0 0 6px var(--neon-cyan); }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; background: var(--neon-blue); box-shadow: 0 0 6px var(--neon-blue); }
        .typing-dot:nth-child(3) { background: var(--neon-violet); box-shadow: 0 0 6px var(--neon-violet); }
        @keyframes typingBounce { 0%, 80%, 100% { transform: scale(0.5); opacity: 0.3; } 40% { transform: scale(1.1); opacity: 1; } }

        .chips-container { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
        .chip { padding: 0.45rem 1rem; background: var(--bg-tertiary); border: 1px solid var(--border-bright); border-radius: 6px; font-size: 0.8rem; font-family: 'Fira Code', monospace; cursor: pointer; transition: all 0.25s; color: var(--text-code); position: relative; overflow: hidden; font-weight: 600; }
        .chip::before { content: ''; position: absolute; inset: 0; background: var(--accent-gradient); opacity: 0; transition: opacity 0.25s; }
        .chip:hover { border-color: var(--neon-cyan); color: var(--bg-void); transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow-cyan); }
        .chip:hover::before { opacity: 1; }
        .chip span { position: relative; z-index: 1; }

        /* ── INPUT ── */
        .input-area { padding: 1rem 1.25rem; border-top: 1px solid var(--border-bright); backdrop-filter: blur(20px) saturate(180%); background: rgba(6,13,18,0.96); position: relative; }
        [data-theme="light"] .input-area { background: rgba(208,220,234,0.96); }
        .input-area::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--accent-gradient); opacity: 0.3; }

        .input-wrapper { display: flex; gap: 0.75rem; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 10px; padding: 0.625rem 0.875rem; transition: border-color 0.25s, box-shadow 0.25s; position: relative; }
        .input-wrapper::before { content: '>'; font-family: 'Space Mono', monospace; color: var(--neon-cyan); font-size: 0.9rem; align-self: center; flex-shrink: 0; animation: cursorBlink 1s step-end infinite; margin-right: 0.1rem; font-weight: 700; }
        @keyframes cursorBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .input-wrapper:focus-within { border-color: var(--neon-cyan); box-shadow: 0 0 0 1px var(--border-bright), 0 0 20px var(--accent-glow-cyan); }

        .input-field { flex: 1; background: transparent; border: none; outline: none; color: var(--text-primary); font-size: 0.9rem; font-family: 'Fira Code', monospace; font-weight: 500; }
        .input-field::placeholder { color: var(--text-muted); font-style: italic; }

        .send-btn { width: 36px; height: 36px; border-radius: 8px; background: var(--accent-gradient); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s, box-shadow 0.2s; flex-shrink: 0; }
        .send-btn:hover { transform: scale(1.08) rotate(-5deg); box-shadow: 0 0 20px var(--accent-glow-cyan); }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* ── CARDS ── */
        .response-card { background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 10px; padding: 1.25rem; margin-top: 0.75rem; transition: all 0.3s; position: relative; overflow: hidden; }
        .response-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 1px; background: var(--accent-gradient); opacity: 0; transition: opacity 0.3s; }
        .response-card:hover { border-color: var(--border-bright); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.3), 0 0 0 1px var(--border-bright); }
        .response-card:hover::before { opacity: 1; }
        [data-theme="light"] .response-card:hover { box-shadow: 0 8px 30px rgba(0,30,70,0.15), 0 0 0 1px var(--border-bright); }

        .card-header   { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem; }
        .card-title    { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.05rem; color: var(--text-primary); }
        .card-subtitle { font-family: 'Fira Code', monospace; font-size: 0.78rem; color: var(--neon-cyan); margin-top: 0.2rem; opacity: 0.95; font-weight: 600; }
        .card-date     { font-family: 'Space Mono', monospace; font-size: 0.68rem; color: var(--text-muted); background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 0.2rem 0.5rem; border-radius: 4px; white-space: nowrap; font-weight: 700; }
        .card-content  { color: var(--text-secondary); font-size: 0.88rem; line-height: 1.7; }

        .tech-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 1rem; }
        .tech-tag { padding: 0.2rem 0.65rem; background: rgba(0,255,225,0.07); color: var(--neon-cyan); border: 1px solid rgba(0,255,225,0.2); border-radius: 4px; font-size: 0.72rem; font-family: 'Fira Code', monospace; transition: all 0.2s; font-weight: 600; }
        .tech-tag:hover { background: rgba(0,255,225,0.15); border-color: var(--neon-cyan); box-shadow: 0 0 8px var(--accent-glow-cyan); }
        [data-theme="light"] .tech-tag { background: rgba(0,63,130,0.1); border-color: rgba(0,63,130,0.35); color: #004a8f; }
        [data-theme="light"] .tech-tag:hover { background: rgba(0,63,130,0.2); border-color: #005fa3; }

        .category-icon       { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1rem; margin-right: 0.75rem; flex-shrink: 0; }
        .category-education  { background: rgba(0,255,136,0.12); border: 1px solid rgba(0,255,136,0.2); }
        .category-experience { background: rgba(0,136,255,0.12); border: 1px solid rgba(0,136,255,0.2); }
        .category-project    { background: rgba(123,47,255,0.12); border: 1px solid rgba(123,47,255,0.2); }
        .category-skill      { background: rgba(255,189,46,0.12); border: 1px solid rgba(255,189,46,0.2); }
        .category-profile    { background: rgba(0,255,225,0.12); border: 1px solid rgba(0,255,225,0.2); }
        [data-theme="light"] .category-education  { background: rgba(0,85,53,0.1);  border-color: rgba(0,85,53,0.25); }
        [data-theme="light"] .category-experience { background: rgba(0,61,130,0.1); border-color: rgba(0,61,130,0.25); }
        [data-theme="light"] .category-project    { background: rgba(61,15,168,0.1); border-color: rgba(61,15,168,0.25); }
        [data-theme="light"] .category-skill      { background: rgba(130,90,0,0.1); border-color: rgba(130,90,0,0.25); }
        [data-theme="light"] .category-profile    { background: rgba(0,63,130,0.1); border-color: rgba(0,63,130,0.25); }

        /* ── PHOTO MODAL ── */
        .photo-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); backdrop-filter: blur(12px); z-index: 1000; justify-content: center; align-items: center; cursor: pointer; animation: modalFadeIn 0.3s ease; }
        .photo-modal.active { display: flex; }
        .photo-modal img { max-width: 88vw; max-height: 88vh; border-radius: 16px; box-shadow: 0 0 0 1px var(--border-bright), 0 30px 80px rgba(0,0,0,0.7), 0 0 60px var(--accent-glow-cyan); animation: modalZoomIn 0.35s cubic-bezier(0.16,1,0.3,1); }
        .modal-close { position: absolute; top: 24px; right: 32px; font-size: 42px; color: var(--neon-cyan); background: none; border: none; cursor: pointer; opacity: 0.7; transition: opacity 0.2s, transform 0.2s; z-index: 1001; font-family: 'Space Mono', monospace; }
        .modal-close:hover { opacity: 1; transform: scale(1.15) rotate(90deg); }
        @keyframes modalFadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes modalZoomIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* ── MOBILE ── */
        @media (max-width: 768px) {
            .header { padding: 0.875rem; }
            .chat-container { height: auto; min-height: 100vh; }
            .messages-area { height: auto; overflow: visible; }
            .header-content { flex-direction: column; gap: 0.75rem; }
            .header-left { width: 100%; justify-content: center; flex-direction: column; text-align: center; }
            .header-right { width: 100%; justify-content: center; gap: 0.5rem; flex-wrap: wrap; }
            .profile-photo { width: 120px; height: 120px; margin-bottom: 0.5rem; border-radius: 20px; }
            .terminal-dots { display: none; }
            .header-title { font-size: 1rem; }
            .cv-btn-text { display: none; }
            .cv-btn { padding: 0.4rem 0.6rem; }
            .messages-area { padding: 1rem 0.875rem; }
            .bubble { max-width: 92%; padding: 0.75rem 1rem; }
            .input-area { padding: 0.75rem; }
            .input-field { font-size: 16px; }
            .send-btn { width: 32px; height: 32px; }
            .chip { padding: 0.375rem 0.75rem; font-size: 0.75rem; }
            .modal-close { top: 16px; right: 16px; font-size: 32px; }
        }
        @media (max-width: 400px) {
            .header-title { font-size: 0.88rem; }
            .social-link { width: 28px; height: 28px; }
        }

        ::selection { background: rgba(0,255,225,0.25); color: var(--text-primary); }
    </style>
</head>

<body>
    <div class="gradient-bg"></div>
    <div class="scan-sweep"></div>
    <div class="particle-layer" id="particleLayer"></div>

    <!-- Photo Modal -->
    <div class="photo-modal" id="photoModal" onclick="closePhotoModal()">
        <button class="modal-close" onclick="closePhotoModal()">✕</button>
        <img src="{% static 'images/profile.png' %}" alt="Yogesh Gaikwad">
    </div>

    <div class="chat-container">
        <header class="header">
            <div class="header-content">
                <div class="header-left">
                    <div class="terminal-dots"><span></span><span></span><span></span></div>
                    <div class="profile-photo" onclick="openPhotoModal()">
                        <img src="{% static 'images/profile.png' %}" alt="Yogesh Gaikwad">
                    </div>
                    <div>
                        <h1 class="header-title text-xl font-mono">Yogesh Gaikwad</h1>
                        <p class="header-subtitle">
                            <span class="status-dot"></span>Software Engineer · Distributed Systems · Dublin, Ireland
                        </p>
                    </div>
                </div>
                <div class="header-right">
                    <div class="social-links">
                        <a href="https://www.linkedin.com/in/yogesh-gaikwad-jss/" target="_blank" class="social-link" title="LinkedIn">
                            <svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                        </a>
                        <a href="https://github.com/imyogeshgaikwad" target="_blank" class="social-link" title="GitHub">
                            <svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
                        </a>
                        <a href="mailto:imyogeshgaikwad@gmail.com" class="social-link" title="Email">
                            <svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                        </a>
                        <a href="tel:+353874925777" class="social-link" title="Call">
                            <svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                        </a>
                    </div>

                    <a href="{% static 'files/Yogesh_Gaikwad_CV.pdf' %}"
                       download="Yogesh_Gaikwad_CV.pdf"
                       class="cv-btn"
                       title="Download CV">
                        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M12 15V3m0 12l-4-4m4 4l4-4M2 17l.621 2.485A2 2 0 004.561 21h14.878a2 2 0 001.94-1.515L22 17"/>
                        </svg>
                        <span class="cv-btn-text">cv.pdf</span>
                    </a>

                    <button class="theme-toggle" id="themeToggle" title="Toggle Light/Dark Mode"></button>
                </div>
            </div>
        </header>

        <main class="messages-area" id="messagesArea"></main>

        <footer class="input-area">
            <div class="input-wrapper">
                <input type="text" class="input-field" id="messageInput"
                    placeholder="ask about distributed systems, backend infra, projects..." autocomplete="off">
                <button class="send-btn" id="sendBtn" aria-label="Send message">
                    <svg width="16" height="16" fill="none" stroke="white" stroke-width="2.5" viewBox="0 0 24 24">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <script>
        /* ─── PARTICLES ─────────────────────────────────────── */
        (function spawnParticles() {
            const layer = document.getElementById('particleLayer');
            const count = window.innerWidth > 768 ? 18 : 8;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.cssText = `left:${Math.random()*100}%;height:${40+Math.random()*120}px;animation-duration:${6+Math.random()*10}s;animation-delay:${Math.random()*12}s;opacity:${0.3+Math.random()*0.5};`;
                layer.appendChild(p);
            }
        })();

        /* ─── THEME ─────────────────────────────────────────── */
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        if (localStorage.getItem('theme') === 'light') html.setAttribute('data-theme', 'light');
        themeToggle.addEventListener('click', () => {
            const isLight = html.getAttribute('data-theme') === 'light';
            isLight ? html.removeAttribute('data-theme') : html.setAttribute('data-theme', 'light');
            localStorage.setItem('theme', isLight ? 'dark' : 'light');
        });

        /* ─── PHOTO MODAL ───────────────────────────────────── */
        const photoModal = document.getElementById('photoModal');
        function openPhotoModal()  { photoModal.classList.add('active'); }
        function closePhotoModal() { photoModal.classList.remove('active'); }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closePhotoModal(); });

        /* ─── STATE ─────────────────────────────────────────── */
        const messagesArea = document.getElementById('messagesArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn      = document.getElementById('sendBtn');

        let hasClicked = false, currentRevealIndex = -1, isRevealing = false, scrollCooldown = false, initialScrollCount = 0;

        const revealSequence = [
            { query: 'about',        intro: '👤 Profiling Yogesh...' },
            { query: 'experience',   intro: '💼 Scanning work history...' },
            { query: 'skills',       intro: '🔬 Indexing tech stack...' },
            { query: 'education',    intro: '🎓 Loading academic record...' },
            { query: 'projects',     intro: '📂 Fetching repositories...' },
            { query: 'publications', intro: '📄 Retrieving publications...' }
        ];

        /* ─── HELPERS ───────────────────────────────────────── */
        function addAgentMessage(content, isHTML = false, doScroll = true) {
            const div = document.createElement('div');
            div.className = 'message message-agent';
            div.innerHTML = `<div class="avatar font-mono">AI</div><div class="bubble bubble-agent">${isHTML ? content : `<p>${content}</p>`}</div>`;
            messagesArea.appendChild(div);
            if (doScroll) scrollToBottom();
        }
        function addUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'message message-user';
            div.innerHTML = `<div class="bubble bubble-user"><p>${text}</p></div>`;
            messagesArea.appendChild(div);
            scrollToBottom();
        }
        function showTypingIndicator() {
            const div = document.createElement('div');
            div.className = 'message message-agent';
            div.id = 'typingIndicator';
            div.innerHTML = `<div class="avatar font-mono">AI</div><div class="bubble bubble-agent"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;
            messagesArea.appendChild(div);
            scrollToBottom();
        }
        function removeTypingIndicator() { const el = document.getElementById('typingIndicator'); if (el) el.remove(); }
        function scrollToBottom() {
            if (window.innerWidth <= 768) window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
            else messagesArea.scrollTo({ top: messagesArea.scrollHeight, behavior: 'smooth' });
        }

        /* ─── GREETING ──────────────────────────────────────── */
        const greeting = `
            <p class="mb-3" style="font-family:'Space Mono',monospace;font-size:0.85rem;"><span style="color:var(--neon-cyan)">$</span> ./initialize_agent.sh</p>
            <p class="mb-3">Booting <strong style="color:var(--neon-cyan)">Yogesh's Portfolio Agent</strong> <span style="font-size:0.8em">v3.0</span> 👋</p>
            <p style="color:var(--text-secondary);margin-bottom:0.75rem;font-size:0.9rem;">Software Engineer · Distributed Systems · Backend Infrastructure</p>
            <div style="font-family:'Fira Code',monospace;font-size:0.78rem;color:var(--text-muted);background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:8px;padding:0.75rem 1rem;margin-bottom:1rem;line-height:1.7;">
                <span style="color:var(--neon-green)">✓</span> 50,000+ enterprise users · 99.9% uptime · 45% latency reduction<br>
                <span style="color:var(--neon-green)">✓</span> 83% faster deployments · 25% infra cost savings · $30K/year<br>
                <span style="color:var(--neon-green)">✓</span> Stamp 1G · Available immediately · Dublin, Ireland 🇮🇪
            </div>
            <div class="chips-container">
                <button class="chip" data-query="about"><span>👤 about()</span></button>
                <button class="chip" data-query="experience"><span>💼 experience()</span></button>
                <button class="chip" data-query="skills"><span>🔬 skills()</span></button>
                <button class="chip" data-query="education"><span>🎓 education()</span></button>
                <button class="chip" data-query="projects"><span>📂 projects()</span></button>
                <button class="chip" data-query="publications"><span>📄 publications()</span></button>
            </div>
            <p style="color:var(--text-muted);font-size:0.78rem;margin-top:1rem;font-family:'Fira Code',monospace;">// scroll to auto-explore · type any question below · ⬇ cv.pdf to download</p>`;

        /* ─── FETCH ─────────────────────────────────────────── */
        async function fetchCategoryData(query) {
            try { const res = await fetch(`/api/chat/?message=${encodeURIComponent(query)}`); return await res.json(); }
            catch (err) { console.error(err); return null; }
        }

        /* ─── SCROLL REVEAL ─────────────────────────────────── */
        async function revealNextSection() {
            if (isRevealing || hasClicked || currentRevealIndex >= revealSequence.length - 1) return;
            isRevealing = true;
            currentRevealIndex++;
            const section = revealSequence[currentRevealIndex];

            if (currentRevealIndex === 0) {
                addAgentMessage(`<p class="mb-2"><span style="color:var(--neon-cyan);font-family:'Space Mono',monospace;">// scroll detected</span></p><p style="color:var(--text-secondary)">Running full profile scan...</p>`, true, false);
                await new Promise(r => setTimeout(r, 300));
            }
            addAgentMessage(`<p style="color:var(--neon-violet);font-family:'Fira Code',monospace;font-size:0.85rem;">${section.intro}</p>`, true, false);
            showTypingIndicator();
            await new Promise(r => setTimeout(r, 350));
            const data = await fetchCategoryData(section.query);
            removeTypingIndicator();
            if (data && data.success) addAgentMessage(data.html, true, false);

            if (currentRevealIndex < revealSequence.length - 1) {
                await new Promise(r => setTimeout(r, 500));
                addAgentMessage(`<p style="font-size:0.8rem;font-family:'Fira Code',monospace;color:var(--neon-violet);">⬇ scroll to continue... <span style="color:var(--text-muted)">or type below</span></p>`, true, false);
            } else {
                await new Promise(r => setTimeout(r, 500));
                addAgentMessage(`<p class="mb-2"><span style="color:var(--neon-green);font-family:'Space Mono',monospace;">✓ scan complete</span></p><p style="color:var(--text-secondary);font-size:0.9rem;">Full profile loaded. Ask anything below.</p>`, true, false);
            }
            isRevealing = false;
        }

        /* ─── SCROLL HANDLER ────────────────────────────────── */
        function handleScroll(e) {
            if (hasClicked || isRevealing || scrollCooldown || currentRevealIndex >= revealSequence.length - 1) return;
            if (e && e.type === 'wheel' && e.deltaY < 20) return;
            const scrollPos = window.innerHeight + window.scrollY;
            if (document.documentElement.scrollHeight - scrollPos > 500 && e !== undefined) return;
            initialScrollCount++;
            if (initialScrollCount < 2) return;
            scrollCooldown = true;
            setTimeout(() => { scrollCooldown = false; }, currentRevealIndex === -1 ? 400 : 600);
            revealNextSection();
        }

        /* ─── SEND ──────────────────────────────────────────── */
        async function sendMessage(query) {
            if (!query.trim()) return;
            addUserMessage(query);
            messageInput.value = '';
            sendBtn.disabled = true;
            showTypingIndicator();
            await new Promise(r => setTimeout(r, 600 + Math.random() * 200));
            try {
                const res  = await fetch(`/api/chat/?message=${encodeURIComponent(query)}`);
                const data = await res.json();
                removeTypingIndicator();
                if (data.success) {
                    addAgentMessage(data.html, true);
                    const seqIdx = revealSequence.findIndex(item => query.toLowerCase().includes(item.query));
                    if (seqIdx !== -1) {
                        currentRevealIndex = seqIdx; hasClicked = false; initialScrollCount = 10; scrollCooldown = false;
                        if (currentRevealIndex < revealSequence.length - 1) {
                            setTimeout(() => {
                                const others = revealSequence.filter((_, i) => i !== currentRevealIndex)
                                    .map(s => `<button class="chip" data-query="${s.query}"><span>${s.intro.split(' ')[0]} ${s.query}</span></button>`).join('');
                                addAgentMessage(`<p style="color:var(--text-secondary);margin-bottom:0.75rem;font-size:0.85rem;">Continue exploring:</p><div class="chips-container">${others}</div>`, true, false);
                            }, 1000);
                        }
                    }
                } else {
                    addAgentMessage(`<p style="color:var(--text-secondary);"><span style="color:var(--neon-cyan);font-family:'Space Mono',monospace;">// no match</span><br>Try: skills, experience, projects, education, or about.</p>`, true);
                }
            } catch (err) {
                removeTypingIndicator();
                addAgentMessage(`<p style="color:var(--neon-pink);">Connection error. Please retry.</p>`, true);
            }
            sendBtn.disabled = false;
            messageInput.focus();
        }

        /* ─── EVENTS ────────────────────────────────────────── */
        sendBtn.addEventListener('click', () => { hasClicked = true; sendMessage(messageInput.value); });
        messageInput.addEventListener('keypress', e => { if (e.key === 'Enter') { hasClicked = true; sendMessage(messageInput.value); } });
        messageInput.addEventListener('focus', () => { hasClicked = true; });
        messagesArea.addEventListener('click', e => {
            const chip = e.target.classList.contains('chip') ? e.target : e.target.closest('.chip');
            if (!chip) return;
            const query = chip.dataset.query;
            if (!revealSequence.some(item => query.toLowerCase().includes(item.query))) hasClicked = true;
            sendMessage(query);
        });
        document.addEventListener('wheel', handleScroll, { passive: true });
        let touchStartY = 0;
        document.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; });
        document.addEventListener('touchmove', e => { if (touchStartY - e.touches[0].clientY > 50) { handleScroll(); touchStartY = e.touches[0].clientY; } });

        /* ─── INIT ──────────────────────────────────────────── */
        window.addEventListener('DOMContentLoaded', () => { addAgentMessage(greeting, true); });
    </script>
</body>
</html>
